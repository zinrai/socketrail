name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check that the BPF objects were generated from these sources
        run: sha256sum -c --quiet bpf/sources.sha256

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build
        run: go build .

  # Why not leave loading to the release check on a real host: dependency
  # updates arrive every week, and the loader, the verifier and the attach
  # points are what a cilium/ebpf update can break while unit tests pass.
  smoke:
    runs-on: ubuntu-latest
    # Why not the default of six hours: a hang in the kernel or in socketrail
    # would hold the runner that long before anyone saw a failure.
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build .

      - name: Install nft
        run: command -v nft || (sudo apt-get update && sudo apt-get install -y nftables)

      - name: Load, attach and record
        run: sudo python3 scripts/smoke.py ./socketrail
